  <!--seo-noscript:start-->
  <!--
    Content for clients that do not run JavaScript.

    This is the whole reason answer engines could not read the site: the app is
    client-rendered, so the shell they receive is <div id="root"></div> and
    nothing else. ChatGPT-User, PerplexityBot and ClaudeBot fetch HTML and do
    not execute scripts, so "allowed to crawl" and "able to read" were two
    different things here, and only the first one was ever true.

    Kept as a faithful summary of the rendered page, not a keyword list. If the
    homepage copy changes materially, change this with it - a <noscript> block
    that disagrees with the rendered page is worse than none.
  -->
  <noscript>
    <main>
      <h1>Find out where your F-1 visa interview breaks</h1>

      <p>
        Altovisas is a free practice tool for the United States F-1 student visa
        interview. You describe your profile and answer three questions. We read
        your answers against 16,204 self-reported interview write-ups and name the
        specific points where consular officers push back on files like yours.
        No account is required and it takes about four minutes.
      </p>

      <h2>Where the data comes from</h2>
      <p>
        16,204 accounts of F-1 visa interviews between 2020 and 2026, written by
        applicants about their own interviews and posted publicly online, then
        de-duplicated and parsed question by question. Roughly 200 more arrive
        each month.
      </p>

      <h2>How to read the numbers</h2>
      <p>
        The dataset is self-selected and self-reported. Approval shares describe
        who chose to write something down, not the true approval rate at any
        consulate. Associations in the data are correlational, not causal, and
        consular practice changes over time, so older records may describe a
        process that no longer resembles the current one. Nothing here predicts
        an individual outcome.
      </p>

      <h2>What this is not</h2>
      <p>
        Altovisas is not legal or immigration advice, and is not affiliated with
        the U.S. Department of State, any embassy or consulate, or any other
        government body. It cannot influence a visa decision. Answers you give at
        a real interview must be truthful and your own. For advice about your own
        case, consult a licensed immigration attorney.
      </p>

      <p>

      </p>
