[project]
name = "visa-llm"
version = "0.1.0"
description = "F1 visa interview prep: dataset pipeline, analytics, and a grounded answer evaluator"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pydantic>=2.9",
    "anthropic>=1.0",
    "typer>=0.15",
    "rich>=13",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
rag = [
    "sentence-transformers>=3.2",
    "scikit-learn>=1.5",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
dev = [
    "pytest>=8",
]

[project.scripts]
visa-llm = "visa_llm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visa_llm"]
